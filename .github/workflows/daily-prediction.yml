name: Daily prediction

on:
  schedule:
    # Run at 00:01 Europe/Berlin across DST by scheduling both UTC offsets
    - cron: "1 22 * * *"  # hits 00:01 in CEST (UTC+2)
    - cron: "1 23 * * *"  # hits 00:01 in CET  (UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction (no training)
        run: |
          python WeatherData.py --predict-only --source forecast --past-days 20 --forecast-days 3 --extend-to-present --cache-file historical_data.csv --lat 49.59 --lon 11.00

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prediction.json prediction_multi.json prediction_point.json history_predictions.json historical_data.csv metrics.json model_info.json model_log.txt MODEL_LOG.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily prediction update [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
