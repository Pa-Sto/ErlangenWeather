<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560">
  <rect width="1260" height="560" fill="#f6f7f2"/>
  <text x="50" y="60" font-family="Georgia, serif" font-size="30" fill="#1e2b24">Next Steps Roadmap</text>
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="16" fill="#59645d">Ordered for fastest learning per experiment</text>

  <line x1="110" y1="170" x2="1140" y2="170" stroke="#b9c2bb" stroke-width="6"/>

  <circle cx="140" cy="170" r="24" fill="#3e6b8f"/>
  <text x="140" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">1</text>
  <rect x="75" y="210" width="200" height="128" rx="18" fill="#ffffff" stroke="#cfd7d1" stroke-width="2"/>
  <text x="175" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2e26">Freeze benchmark</text>
  <text x="175" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">Separate current-model</text>
  <text x="175" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">backtest from mixed</text>
  <text x="175" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">history predictions.</text>

  <circle cx="390" cy="170" r="24" fill="#3e6b8f"/>
  <text x="390" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">2</text>
  <rect x="290" y="210" width="200" height="128" rx="18" fill="#ffffff" stroke="#cfd7d1" stroke-width="2"/>
  <text x="390" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2e26">Visualize jump days</text>
  <text x="390" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">Highlight front passages</text>
  <text x="390" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">and 24h temperature</text>
  <text x="390" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">swings.</text>

  <circle cx="640" cy="170" r="24" fill="#b07b2c"/>
  <text x="640" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">3</text>
  <rect x="540" y="210" width="200" height="128" rx="18" fill="#ffffff" stroke="#d7d1c5" stroke-width="2"/>
  <text x="640" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2e26">Recent vs full history</text>
  <text x="640" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">Test whether older</text>
  <text x="640" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">regimes are diluting</text>
  <text x="640" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">current local behavior.</text>

  <circle cx="890" cy="170" r="24" fill="#b07b2c"/>
  <text x="890" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">4</text>
  <rect x="790" y="210" width="200" height="128" rx="18" fill="#ffffff" stroke="#d7d1c5" stroke-width="2"/>
  <text x="890" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2e26">Transition-aware loss</text>
  <text x="890" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">Weight rare high-delta</text>
  <text x="890" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">temperature windows</text>
  <text x="890" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">more strongly.</text>

  <circle cx="1120" cy="170" r="24" fill="#6f4e9b"/>
  <text x="1120" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">5</text>
  <rect x="1020" y="210" width="200" height="128" rx="18" fill="#ffffff" stroke="#d7d1c5" stroke-width="2"/>
  <text x="1120" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2e26">Visual model card</text>
  <text x="1120" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">Expose setup, metrics,</text>
  <text x="1120" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">and experiment deltas</text>
  <text x="1120" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6962">on the website.</text>

  <rect x="70" y="404" width="1120" height="96" rx="18" fill="#ffffff" stroke="#d8ddd8" stroke-width="2"/>
  <text x="95" y="440" font-family="Arial, sans-serif" font-size="18" fill="#263128">Current reading:</text>
  <text x="250" y="440" font-family="Arial, sans-serif" font-size="17" fill="#4b5a51">the grid helps Rain and Cloud already, but the temperature path still</text>
  <text x="250" y="466" font-family="Arial, sans-serif" font-size="17" fill="#4b5a51">looks too conservative and persistence-heavy.</text>
</svg>
