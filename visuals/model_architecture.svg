<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470">
  <rect width="1180" height="470" fill="#fbf9f4"/>
  <text x="50" y="58" font-family="Georgia, serif" font-size="30" fill="#1c2731">Deployed Model Architecture</text>
  <text x="50" y="88" font-family="Arial, sans-serif" font-size="16" fill="#5d6771">SavedModel in model/ with input signature 240 hours x 28 features</text>

  <rect x="50" y="145" width="155" height="92" rx="14" fill="#1f5f8b"/>
  <text x="127.5" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">Input window</text>
  <text x="127.5" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d8eef9">240 x 28</text>

  <rect x="255" y="145" width="170" height="92" rx="14" fill="#3f7d58"/>
  <text x="340" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">Patch Conv1D</text>
  <text x="340" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e3f6ea">kernel 4, stride 2</text>

  <rect x="475" y="145" width="170" height="92" rx="14" fill="#8b6f47"/>
  <text x="560" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">Token sequence</text>
  <text x="560" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff3df">119 x 128</text>

  <rect x="695" y="116" width="225" height="150" rx="14" fill="#334d63"/>
  <text x="807.5" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#fff">Transformer encoder</text>
  <text x="807.5" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dfeaf2">4 blocks, 4 heads</text>
  <text x="807.5" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dfeaf2">d_model 128</text>
  <text x="807.5" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dfeaf2">FFN 256, dropout 0.1</text>

  <rect x="970" y="145" width="170" height="92" rx="14" fill="#b24c3d"/>
  <text x="1055" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">GAP + Head</text>
  <text x="1055" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffe6e2">72 x 3</text>

  <line x1="205" y1="191" x2="255" y2="191" stroke="#7d8a96" stroke-width="4"/>
  <polygon points="255,191 242,184 242,198" fill="#7d8a96"/>
  <line x1="425" y1="191" x2="475" y2="191" stroke="#7d8a96" stroke-width="4"/>
  <polygon points="475,191 462,184 462,198" fill="#7d8a96"/>
  <line x1="645" y1="191" x2="695" y2="191" stroke="#7d8a96" stroke-width="4"/>
  <polygon points="695,191 682,184 682,198" fill="#7d8a96"/>
  <line x1="920" y1="191" x2="970" y2="191" stroke="#7d8a96" stroke-width="4"/>
  <polygon points="970,191 957,184 957,198" fill="#7d8a96"/>

  <rect x="70" y="305" width="1040" height="112" rx="16" fill="#ffffff" stroke="#ddd4c7" stroke-width="2"/>
  <text x="95" y="340" font-family="Georgia, serif" font-size="22" fill="#1c2731">Feature and objective summary</text>
  <text x="95" y="372" font-family="Arial, sans-serif" font-size="16" fill="#4d5a66">28 features = 9 weather variables + 13 time features + 6 derived physical features</text>
  <text x="95" y="398" font-family="Arial, sans-serif" font-size="16" fill="#4d5a66">Targets: temperature_2m, rain, cloudcover across 72 hourly lead times</text>
  <text x="650" y="398" font-family="Arial, sans-serif" font-size="16" fill="#4d5a66">Loss: weighted multi-target MSE</text>
</svg>
