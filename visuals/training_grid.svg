  <circle cx="380" cy="365" r="26" fill="#db6c31"/><text x="380" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">L4</text>
  <circle cx="600" cy="365" r="18" fill="#7891a6"/><text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L5</text>

