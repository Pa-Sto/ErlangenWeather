  <text x="955" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Local grid cache</text>
  <text x="955" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">8 neighboring points</text>
  <text x="955" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">available for research</text>

