  <line x1="307" y1="150" x2="307" y2="500" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="453" y1="150" x2="453" y2="500" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>

  <circle cx="160" cy="500" r="18" fill="#7891a6"/><text x="160" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L0</text>
