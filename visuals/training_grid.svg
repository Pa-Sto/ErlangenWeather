<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <rect width="1080" height="620" fill="#f7f5ef"/>
  <rect x="40" y="40" width="640" height="540" rx="24" fill="#fffdf8" stroke="#d7d1c7" stroke-width="2"/>
  <rect x="720" y="40" width="320" height="540" rx="24" fill="#13212f" stroke="#22384d" stroke-width="2"/>
  <text x="70" y="85" font-family="Georgia, serif" font-size="30" fill="#18222e">Training Data Grid</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="16" fill="#54606c">3x3 measuring points around Erlangen, 75 km radius</text>

  <line x1="150" y1="500" x2="550" y2="500" stroke="#c3bdb3" stroke-width="2"/>
  <line x1="150" y1="500" x2="150" y2="140" stroke="#c3bdb3" stroke-width="2"/>
  <text x="560" y="505" font-family="Arial, sans-serif" font-size="14" fill="#6d665d">east</text>
  <text x="120" y="135" font-family="Arial, sans-serif" font-size="14" fill="#6d665d">north</text>

  <line x1="150" y1="220" x2="550" y2="220" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="150" y1="360" x2="550" y2="360" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="283" y1="140" x2="283" y2="500" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="417" y1="140" x2="417" y2="500" stroke="#e3ddd2" stroke-width="1.5" stroke-dasharray="6 6"/>

  <circle cx="150" cy="500" r="18" fill="#4f7ea8"/><text x="150" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L0</text>
  <circle cx="350" cy="500" r="18" fill="#4f7ea8"/><text x="350" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L1</text>
  <circle cx="550" cy="500" r="18" fill="#4f7ea8"/><text x="550" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L2</text>

  <circle cx="150" cy="360" r="18" fill="#4f7ea8"/><text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L3</text>
  <circle cx="350" cy="360" r="24" fill="#db6c31"/><text x="350" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">L4</text>
  <circle cx="550" cy="360" r="18" fill="#4f7ea8"/><text x="550" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L5</text>

  <circle cx="150" cy="220" r="18" fill="#4f7ea8"/><text x="150" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L6</text>
  <circle cx="350" cy="220" r="18" fill="#4f7ea8"/><text x="350" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L7</text>
  <circle cx="550" cy="220" r="18" fill="#4f7ea8"/><text x="550" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">L8</text>

  <text x="350" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#18222e">Erlangen</text>
  <text x="350" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7279">49.59, 11.00</text>

  <text x="750" y="90" font-family="Georgia, serif" font-size="24" fill="#f6f2eb">Key facts</text>
  <text x="750" y="130" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Base point</text>
  <text x="750" y="152" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Erlangen (L4)</text>
  <text x="750" y="196" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Neighbor points</text>
  <text x="750" y="218" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">8 surrounding cells</text>
  <text x="750" y="262" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Hourly variables per point</text>
  <text x="750" y="284" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">9 weather series</text>
  <text x="750" y="328" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Base archive span</text>
  <text x="750" y="350" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">1941-03-04 to</text>
  <text x="750" y="374" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">2026-02-09</text>
  <text x="750" y="418" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Raw merged dataframe</text>
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">744,552 x 113</text>
  <text x="750" y="484" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Final model input</text>
  <text x="750" y="506" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">240 x 132 per sample</text>

  <rect x="748" y="532" width="18" height="18" rx="4" fill="#db6c31"/>
  <text x="778" y="546" font-family="Arial, sans-serif" font-size="14" fill="#f1f6fb">center point used</text>
  <text x="778" y="564" font-family="Arial, sans-serif" font-size="14" fill="#f1f6fb">as target location</text>
  <rect x="748" y="582" width="18" height="18" rx="4" fill="#4f7ea8"/>
  <text x="778" y="596" font-family="Arial, sans-serif" font-size="14" fill="#f1f6fb">neighboring spatial</text>
  <text x="778" y="614" font-family="Arial, sans-serif" font-size="14" fill="#f1f6fb">context points</text>
</svg>
