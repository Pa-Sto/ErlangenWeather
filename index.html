<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ErlangenWeather — 3-Day Forecast</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --temp: #fbbf24;
      --rain: #3b82f6;
    }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    header { padding: 20px; border-bottom: 1px solid #1f2937; display:flex; align-items:center; justify-content: space-between; gap: 16px; }
    header h1 { margin:0; font-size: 20px; font-weight: 700; }
    header .meta { font-size: 14px; color: var(--muted); }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .kpi-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--panel); border: 1px solid #1f2937; border-radius: 10px; padding: 12px 14px; }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .kpi .value { font-weight: 700; font-size: 18px; margin-top: 4px; }

    .days { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    @media (max-width: 980px) { .days { grid-template-columns: 1fr; } }

    .day-card { background: var(--panel); border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; display:flex; flex-direction:column; }
    .day-head { padding: 14px 16px; border-bottom: 1px solid #1f2937; display:flex; align-items:baseline; justify-content: space-between; gap: 12px; }
    .day-head .date { font-weight: 700; white-space: normal; }
    .day-head .date .date-line { display: block; white-space: nowrap; margin-top: 2px; }
    .day-head .stats { color: var(--muted); font-size: 14px; }

    .hours { padding: 10px 14px 14px; display:grid; grid-template-columns: 1fr; gap: 6px; }
    .hour-row { display:flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed #1f2937; padding: 8px 0; column-gap: 12px; }
    .hour-row:last-child { border-bottom: 0; }
    .hour-row strong { font-weight: 700; }
    .sparkline { padding: 8px 14px 0; }
    .sparkline svg { width: 100%; height: 64px; display: block; }
    .sparkline.temp path.line { stroke: var(--temp); }
    .sparkline line.mean { stroke: var(--muted); stroke-dasharray: 3 3; }
    .sparkline.temp circle.dot { fill: var(--temp); }
    .sparkline.rain rect { fill: var(--rain); }
    .axis-text { fill: var(--muted); font-size: 11px; }
    .axis-line { stroke: #374151; }

    .section { margin-top: 22px; }
    .panel { background: var(--panel); border: 1px solid #1f2937; border-radius: 10px; padding: 14px 16px; }
    .small { font-size: 14px; color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <header>
    <h1>🌤️ ErlangenWeather — 3-Day Forecast</h1>
    <div class="meta" id="updated">Loading…</div>
  </header>

  <div class="container">
    <div class="kpi-row">
      <div class="kpi"><div class="label">Overall Accuracy</div><div class="value" id="acc">—</div></div>
      <div class="kpi"><div class="label">Forecast Start</div><div class="value" id="start">—</div></div>
      <div class="kpi"><div class="label">Horizon</div><div class="value" id="horizon">—</div></div>
    </div>

    <div class="days" id="days"></div>

    <div class="section">
      <div class="panel small" id="modelInfo">Model info loading…</div>
    </div>
  </div>

  <script>
    const RAIN_MIN = 0.05; // mm/h threshold below which we treat rain as zero

    async function loadJSON(url) {
      const r = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error('Failed to load ' + url + ': ' + r.status);
      return r.json();
    }

    function groupByDateMulti(multi) {
      // multi: { timestamp: { temp_c, rain_mm|precip_mm, cloudcover_pct } }
      const entries = Object.entries(multi).map(([ts, obj]) => ({
        ts,
        temp: Number(obj.temp_c ?? obj.temperature_c ?? obj.temperature_2m ?? obj.temp ?? 0),
        rain: (v => (v < RAIN_MIN ? 0 : v))(Number(obj.rain_mm ?? obj.precip_mm ?? obj.precipitation ?? 0)),
        cloud: Number(obj.cloudcover_pct ?? obj.cloudcover ?? 0),
      })).sort((a,b) => a.ts.localeCompare(b.ts));
      const groups = new Map();
      for (const e of entries) {
        const d = e.ts.slice(0,10); // YYYY-MM-DD
        if (!groups.has(d)) groups.set(d, []);
        groups.get(d).push(e);
      }
      return groups; // Map(date -> [{ts,temp,rain,cloud}])
    }

    function fmtTime(ts) {
      // ts like 'YYYY-MM-DDTHH:MM:SS'
      return ts.slice(11,16);
    }

    function weekdayName(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'long' });
    }

    function formatDMY(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function statFromSeries(list) {
      const vals = list.map(x => x.temp);
      const max = Math.max(...vals), min = Math.min(...vals);
      const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
      const tmax = list[vals.indexOf(max)].ts;
      const tmin = list[vals.indexOf(min)].ts;
      return { max, min, mean, tmax, tmin };
    }

    function sparklineSVG(list, stats) {
      const w = 320, h = 64, pad = 6, lpad = 38;
      const vals = list.map(p => p.temp);
      const n = vals.length || 1;
      const min = Math.min(...vals);
      const max = Math.max(...vals);
      const range = (max - min) || 1;
      const x = (i) => lpad + ((w - lpad - pad) * (i / (n - 1 || 1)));
      const y = (v) => pad + ((h - 2*pad) * (1 - ((v - min) / range)));

      // series path
      let d = "";
      list.forEach((p, i) => { const X = x(i), Y = y(p.temp); d += (i ? "L" : "M") + X + " " + Y + " "; });

      // stats
      const mean = (stats && typeof stats.mean === 'number') ? stats.mean : (vals.reduce((a,b)=>a+b,0)/n);
      const yMean = y(mean);

      // x-axis ticks at standard hours
      const xFromHour = (hr) => lpad + ((w - lpad - pad) * (hr / 24));
      const hours = [0, 6, 12, 18, 24];
      const xticks = hours.map(hr => `
        <line class="axis-line" x1="${xFromHour(hr)}" y1="${h-pad}" x2="${xFromHour(hr)}" y2="${h-pad-4}" stroke-width="1"/>
        <text class="axis-text" x="${xFromHour(hr)}" y="${h-2}" text-anchor="middle">${String(hr).padStart(2,'0')}</text>
      `).join('');

      return `
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <!-- Y axis (left) and labels -->
        <line class="axis-line" x1="${lpad}" y1="${pad}" x2="${lpad}" y2="${h-pad}" stroke-width="1"/>
        <text class="axis-text" x="${lpad-6}" y="${y(max)+4}" text-anchor="end">${max.toFixed(1)}</text>
        <text class="axis-text" x="${lpad-6}" y="${y(min)+4}" text-anchor="end">${min.toFixed(1)}</text>
        <!-- X axis (bottom) and hour ticks -->
        <line class="axis-line" x1="${lpad}" y1="${h-pad}" x2="${w - pad}" y2="${h-pad}" stroke-width="1"/>
        ${xticks}
        <!-- Mean and series -->
        <line class="mean" x1="${lpad}" x2="${w - pad}" y1="${yMean}" y2="${yMean}" stroke-width="1"/>
        <path class="line" d="${d}" fill="none" stroke-width="2"/>
      </svg>`;
    }

    function rainBarsSVG(list) {
      const w = 320, h = 64, pad = 6, lpad = 38;
      const valsRaw = list.map(p => Math.max(0, Number(p.rain || 0)));
      const vals = valsRaw.map(v => (v < RAIN_MIN ? 0 : v));
      const n = vals.length || 1;
      const vmax = Math.max(0, ...vals);
      const plotW = w - lpad - pad;
      const bw = plotW / n;
      let rects = '';
      if (vmax > 0) {
        vals.forEach((v, i) => {
          const hh = (v / vmax) * (h - 2*pad);
          const x = lpad + i * bw;
          const y = h - pad - hh;
          rects += `<rect x="${x}" y="${y}" width="${Math.max(1, bw - 1)}" height="${Math.max(0, hh)}" />`;
        });
      }
      // x-axis ticks at standard hours
      const xFromHour = (hr) => lpad + ((w - lpad - pad) * (hr / 24));
      const hours = [0, 6, 12, 18, 24];
      const xticks = hours.map(hr => `
        <line class="axis-line" x1="${xFromHour(hr)}" y1="${h-pad}" x2="${xFromHour(hr)}" y2="${h-pad-4}" stroke-width="1"/>
        <text class="axis-text" x="${xFromHour(hr)}" y="${h-2}" text-anchor="middle">${String(hr).padStart(2,'0')}</text>
      `).join('');

      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <!-- Y axis (left) and labels -->
        <line class="axis-line" x1="${lpad}" y1="${pad}" x2="${lpad}" y2="${h-pad}" stroke-width="1"/>
        <text class="axis-text" x="${lpad-6}" y="${pad+10}" text-anchor="end">${vmax.toFixed(1)}</text>
        <text class="axis-text" x="${lpad-6}" y="${h-pad}" text-anchor="end">0</text>
        <!-- X axis (bottom) and hour ticks -->
        <line class="axis-line" x1="${lpad}" y1="${h-pad}" x2="${w - pad}" y2="${h-pad}" stroke-width="1"/>
        ${xticks}
        ${rects}
      </svg>`;
    }

    function iconForHour(rain, cloud) {
      if (rain > 0.2) return '🌧️';
      if (cloud >= 70) return '☁️';
      if (cloud >= 30) return '⛅';
      return '☀️';
    }

    function renderDayCard(dateStr, list, summary) {
      const stats = summary || statFromSeries(list);
      const sumRain = list.reduce((s,p)=> s + (p.rain || 0), 0);
      const wrap = document.createElement('div');
      wrap.className = 'day-card';
      wrap.innerHTML = `
        <div class="day-head">
          <div class="date"><span class="weekday">${weekdayName(dateStr)}</span><span class="date-line mono">${formatDMY(dateStr)}</span></div>
          <div class="stats">
            Rain total: <strong>${sumRain.toFixed(1)} mm</strong>
            &nbsp;·&nbsp; Max: <strong>${stats.max.toFixed(1)}°C</strong>
            &nbsp;·&nbsp; Min: <strong>${stats.min.toFixed(1)}°C</strong>
            &nbsp;·&nbsp; Mean: ${stats.mean.toFixed(1)}°C
          </div>
        </div>
        <div class="sparkline temp">
          <div class="small" style="margin-bottom:4px;">Temperature (°C)</div>
        </div>
        <div class="sparkline rain">
          <div class="small" style="margin-bottom:4px;">Rain (mm/h)</div>
        </div>
        <div class="hours"></div>
      `;
      const sparkTemp = wrap.querySelector('.sparkline.temp');
      const sparkRain = wrap.querySelector('.sparkline.rain');
      sparkTemp.innerHTML += sparklineSVG(list, stats);
      sparkRain.innerHTML += rainBarsSVG(list);
      const hours = wrap.querySelector('.hours');
      for (const {ts, temp, rain, cloud} of list) {
        const row = document.createElement('div');
        row.className = 'hour-row';
        const icon = iconForHour(rain, cloud);
        const rainShown = (rain < RAIN_MIN ? 0 : rain);
        row.innerHTML = `<strong class="mono">${fmtTime(ts)}</strong> <span>${icon} ${temp.toFixed(1)}°C · ${rainShown.toFixed(1)} mm · ${Math.round(cloud)}% cloud</span>`;
        hours.appendChild(row);
      }
      return wrap;
    }

    (async () => {
      try {
        let multi, point, acc, info;
        try {
          [multi, point, acc, info] = await Promise.all([
            loadJSON('prediction_multi.json'),
            loadJSON('prediction_point.json'),
            loadJSON('accuracy_overall.json').catch(()=>null),
            loadJSON('model_info.json').catch(()=>null),
          ]);
        } catch (e) {
          console.warn('prediction_multi.json missing, falling back to prediction.json', e);
          const pred = await loadJSON('prediction.json');
          // Convert temp-only format to multi-like structure (temp, zero rain/cloud)
          multi = {};
          for (const [ts, obj] of Object.entries(pred)) {
            const temp = (obj && typeof obj === 'object')
              ? Number(obj.temp_c ?? obj.temperature_c ?? obj.temperature_2m ?? obj.temp ?? obj.value ?? 0)
              : Number(obj);
            multi[ts] = { temp_c: temp, rain_mm: 0, cloudcover_pct: 0 };
          }
          [point, acc, info] = await Promise.all([
            loadJSON('prediction_point.json'),
            loadJSON('accuracy_overall.json').catch(()=>null),
            loadJSON('model_info.json').catch(()=>null),
          ]);
        }

        // KPI header
        document.getElementById('updated').textContent = `Updated: ${point.generated_at || '—'}`;
        document.getElementById('start').textContent = point.start_time || '—';
        document.getElementById('horizon').textContent = (point.horizon_hours || 72) + ' h';
        document.getElementById('acc').textContent = acc ? `${acc.accuracy_percent.toFixed(0)}%` : '—';

        // Group into calendar days and render three days starting at model start_time
        const byDay = groupByDateMulti(multi);
        const daysEl = document.getElementById('days');

        let startDateKey = (point.start_time || '').slice(0,10); // YYYY-MM-DD
        let dayKeys = Array.from(byDay.keys());
        if (startDateKey) {
          dayKeys = dayKeys.filter(d => d >= startDateKey);
        }
        dayKeys = dayKeys.slice(0,3);

        // Build summaries from point.daily_summaries if dates match
        const summaries = new Map();
        if (point.daily_summaries && Array.isArray(point.daily_summaries)) {
          for (const s of point.daily_summaries) summaries.set(s.date, s);
        }

        for (const d of dayKeys) {
          const list = byDay.get(d);
          const s = summaries.has(d) ? {
            max: Number(summaries.get(d).max_temp_c),
            min: Number(summaries.get(d).min_temp_c),
            mean: Number(summaries.get(d).mean_temp_c),
            tmax: summaries.get(d).max_time,
            tmin: summaries.get(d).min_time,
          } : null;
          daysEl.appendChild(renderDayCard(d, list, s));
        }

        // Model info panel
        const mi = document.getElementById('modelInfo');
        if (info) {
          const lines = [];
          if (info.model_name) lines.push(`<strong>${info.model_name}</strong>`);
          if (info.architecture) lines.push(`Architecture: ${info.architecture}`);
          if (info.hparams) lines.push(`HParams: ${info.hparams}`);
          if (info.training_data) lines.push(`Training data: ${info.training_data}`);
          if (info.features_count) lines.push(`Features: ${info.features_count}`);
          if (info.feature_names && info.feature_names.length) lines.push(`Feature names: <span class="mono">${info.feature_names.join(', ')}</span>`);
          mi.innerHTML = lines.join('<br/>');
        } else {
          mi.textContent = 'Model info unavailable.';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('updated').textContent = 'Failed to load data';
      }
    })();
  </script>
</body>
</html>
